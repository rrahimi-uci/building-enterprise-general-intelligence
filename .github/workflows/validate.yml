name: Validate book
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      # No system font installation needed: tools/generate_cover.py uses the
      # Liberation Sans bundled in latex/fonts/, which makes asset rendering
      # identical on every host and supersedes the runner-specific symlink
      # workaround this job used to do. Diagrams are rendered from source by
      # tools/render_diagrams.py, which needs graphviz and is run separately.
      - run: pip install -r requirements.txt
      - run: make build references validate deterministic
      - name: Fail if generated publication artifacts are stale
        run: |
          # Only the publication artifacts are gated. qa/ and reports/ are
          # deliberately excluded: they record whichever build ran last, so
          # `make validate` and `make deterministic` legitimately leave
          # different values there.
          PUBLICATION='book/manuscript.md dist/ latex/content/ assets/cover/'
          if ! git diff --quiet -- $PUBLICATION; then
            echo "::error::Publication artifacts are out of date. Run 'make build latex' and commit the result."
            git diff --stat -- $PUBLICATION
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: book-v1.0.0-validation
          path: |
            dist/
            reports/
            qa/validation-report.json
            qa/determinism/determinism-report.json
