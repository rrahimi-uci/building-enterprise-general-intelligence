name: Build XeLaTeX edition

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run; the PDF build is the slowest job in
# the repository and there is no value in finishing a stale one.
concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Regenerate the LaTeX source from the canonical Markdown and hand it to the
  # compile job. This is what keeps a stale committed book-content.tex from
  # silently producing a green build of yesterday's text.
  latex-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 tools/assemble_manuscript.py --root .
      - run: python3 tools/build_latex.py --root .
      - run: python3 tools/validate_latex.py --root .
      - name: Fail if the committed LaTeX source is stale
        run: |
          # book-content.tex is generated but tracked. If regenerating it changes
          # the file, someone edited source/parts/ without running `make latex`.
          if ! git diff --quiet -- latex/content/ dist/ book/manuscript.md; then
            echo "::error::Generated files are out of date. Run 'make latex' (or 'make build latex') and commit the result."
            git diff --stat -- latex/content/ dist/ book/manuscript.md
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: latex-source
          path: |
            latex/content/book-content.tex
            book/manuscript.md
          retention-days: 7

  xelatex:
    needs: latex-source
    runs-on: ubuntu-latest
    container: texlive/texlive:latest-full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: latex-source
          # Restores latex/content/book-content.tex and book/manuscript.md over
          # the checkout, so the PDF is built from freshly generated source.
          path: .
      - run: chmod +x latex/compile.sh && latex/compile.sh
      - name: Summarize the build
        run: |
          LOG=latex/build/Enterprise-Agentic-AI-Architecture-Developer-Platform-Guide-v2.0.0.log
          echo "### XeLaTeX build" >> "$GITHUB_STEP_SUMMARY"
          grep -o 'Output written.*([0-9]* pages)' "$LOG" | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          echo "- undefined references: $(grep -c 'undefined' "$LOG" || true)" >> "$GITHUB_STEP_SUMMARY"
          echo "- overfull boxes: $(grep -c 'Overfull' "$LOG" || true)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-agentic-ai-book-v2.0.0-xelatex
          path: |
            dist/Enterprise-Agentic-AI-Architecture-Developer-Platform-Guide-v2.0.0-LaTeX.pdf
            latex/build/*.log
            latex/build/*.toc

  # The compiled PDF is deliberately not committed (see .gitignore). Tagging a
  # release is how a published PDF gets a permanent, downloadable home.
  publish:
    needs: xelatex
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: enterprise-agentic-ai-book-v2.0.0-xelatex
          path: artifacts
      - name: Attach the publication PDF to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "artifacts/dist/Enterprise-Agentic-AI-Architecture-Developer-Platform-Guide-v2.0.0-LaTeX.pdf" \
            "dist/Enterprise-Agentic-AI-Architecture-Developer-Platform-Guide-v2.0.0.docx" \
            "dist/Enterprise-Agentic-AI-Architecture-Developer-Platform-Guide-v2.0.0.md" \
            --clobber
