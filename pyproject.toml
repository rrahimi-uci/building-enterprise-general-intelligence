[project]
name = "enterprise-agentic-ai-book-system"
version = "1.0.0"
description = "Reproducible publication system for the Enterprise Agentic AI Architecture & Developer Platform Guide"
requires-python = ">=3.13,<3.14"
dependencies = [
  "python-docx==1.2.0",
  "Pillow==12.3.0",
  "PyMuPDF==1.28.2",
  "pdfplumber==0.11.10",
  "fonttools==4.64.0",
]

[tool.book]
canonical_source = "source/parts/*.md"
release = "1.0.0"
